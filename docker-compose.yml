version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coop
      POSTGRES_PASSWORD: coop_dev_password
      POSTGRES_DB: coop_mvp
    ports:
      - "5432:5432"
    volumes:
      - coop_db_data:/var/lib/postgresql/data

volumes:
  coop_db_data:
